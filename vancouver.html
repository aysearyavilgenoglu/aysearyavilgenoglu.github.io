<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vancouver – Ayse Arya Vilgenoglu</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    #map {
      width: 100%;
      height: 520px;
      border: 1px solid #e4e4e4;
      border-radius: 8px;
      margin-top: 2rem;
    }

    .map-subtitle {
      text-align: center;
      color: #999;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    /* Tooltip */
    .leaflet-tooltip {
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      padding: 0.55rem 0.75rem;
      max-width: 220px;
      pointer-events: none;
    }

    .leaflet-tooltip::before {
      border-top-color: #e4e4e4;
    }

    .tooltip-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 0.2rem;
    }

    .tooltip-short {
      font-size: 0.74rem;
      color: #666;
      line-height: 1.45;
      margin: 0;
    }

    /* Popup */
    .leaflet-popup-content-wrapper {
      border-radius: 6px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.10);
      border: 1px solid #ececec;
      padding: 0;
    }

    .leaflet-popup-content {
      margin: 0 !important;
      width: 230px !important;
    }

    .map-popup { padding: 1rem 1.1rem; }

    .map-popup-index {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: #bbb;
      text-transform: uppercase;
      margin-bottom: 0.2rem;
    }

    .map-popup-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 0.1rem;
    }

    .map-popup-type {
      font-size: 0.72rem;
      color: #999;
      font-style: italic;
      margin-bottom: 0.65rem;
    }

    .map-popup-divider {
      border: none;
      border-top: 1px solid #f0f0f0;
      margin: 0 0 0.65rem;
    }

    .map-popup-desc {
      font-size: 0.8rem;
      color: #555;
      line-height: 1.6;
      margin: 0;
    }

    .dot-marker {
      width: 10px;
      height: 10px;
      background: #111;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <header class="py-3 border-bottom bg-white">
    <nav class="container d-flex flex-wrap justify-content-between align-items-center">
      <span class="fs-5 fw-semibold">Ayse Arya Vilgenoglu</span>
      <div class="d-flex gap-3">
        <a href="index.html#about" class="text-decoration-none">About</a>
        <a href="index.html#education" class="text-decoration-none">Education</a>
        <a href="index.html#experience" class="text-decoration-none">Experience</a>
        <a href="index.html#projects" class="text-decoration-none">Projects</a>
        <a href="vancouver.html" class="text-decoration-none fw-semibold">Vancouver</a>
        <a href="visualizations.html" class="text-decoration-none">Visualizations</a>
      </div>
    </nav>
  </header>

  <main class="center-wrapper">
    <div class="profile-container">
      <section>
        <h2 class="text-center w-100">Vancouver</h2>
        <p class="map-subtitle">Five architectural spots I love in the city</p>
        <div id="map"></div>
      </section>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const spots = [
      {
        name: "SFU Burnaby Campus",
        type: "Brutalist University · Arthur Erickson, 1965",
        short: "Concrete platforms merging with the mountain — brutalism at its most poetic.",
        coords: [49.2788, -122.9196],
        desc: "Perched on Burnaby Mountain, SFU's Academic Quadrangle is one of Canada's finest examples of brutalist architecture. Erickson's interlocking concrete platforms blur the boundary between building and landscape — especially striking in fog."
      },
      {
        name: "Vancouver Public Library",
        type: "Civic Architecture · Moshe Safdie, 1995",
        short: "A colosseum in the city grid — public space turned into architectural promenade.",
        coords: [49.2797, -123.1139],
        desc: "The central branch's elliptical colosseum form is bold and unapologetic in the downtown grid. I'm drawn to how Safdie created a public promenade between the curved outer wall and the rectangular tower — urban space as architectural idea."
      },
      {
        name: "Stanley Park Pavilion",
        type: "Heritage Landscape · 1911",
        short: "Landscape and city in quiet dialogue — a designed space that doesn't feel designed.",
        coords: [49.3017, -123.1417],
        desc: "Beyond the natural scenery, the way paths, seawalls, and open space are composed here feels genuinely designed. A rare example of landscape architecture that still holds its own against the city's skyline."
      },
      {
        name: "Chan Centre for the Performing Arts",
        type: "Concert Hall · Bing Thom Architects, 1997",
        short: "A cylindrical form so restrained it feels radical among the campus buildings.",
        coords: [49.2686, -123.2551],
        desc: "Tucked into the UBC campus, the Chan Centre's cylindrical zinc-clad form is quietly radical. The acoustic shell transforms the hall for different performance types — an architectural detail that doubles as spatial choreography."
      },
      {
        name: "Vancouver Convention Centre",
        type: "Waterfront Civic Building · LMN + DA Architects, 2009",
        short: "Six acres of living roof stepping down to the harbour — civic design at urban scale.",
        coords: [49.2893, -123.1114],
        desc: "The living green roof — six acres of native plants — sits above a building that steps down to meet the harbour. The way the structure negotiates between the city grid and the waterfront edge is a masterclass in civic urban design."
      }
    ];

    const map = L.map("map", { zoomControl: true, scrollWheelZoom: false })
                  .setView([49.272, -123.08], 11);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 19
    }).addTo(map);

    const dotIcon = L.divIcon({
      className: "",
      html: '<div class="dot-marker"></div>',
      iconSize: [10, 10],
      iconAnchor: [5, 5],
      popupAnchor: [0, -10]
    });

    spots.forEach((spot, i) => {
      const tooltipHtml = `
        <div class="tooltip-name">${spot.name}</div>
        <p class="tooltip-short">${spot.short}</p>`;

      const popupHtml = `
        <div class="map-popup">
          <div class="map-popup-index">0${i + 1}</div>
          <div class="map-popup-title">${spot.name}</div>
          <div class="map-popup-type">${spot.type}</div>
          <hr class="map-popup-divider" />
          <p class="map-popup-desc">${spot.desc}</p>
        </div>`;

      L.marker(spot.coords, { icon: dotIcon })
        .addTo(map)
        .bindTooltip(tooltipHtml, { direction: "top", offset: [0, -8], opacity: 1 })
        .bindPopup(popupHtml, { maxWidth: 260 });
    });
  </script>
</body>
</html>
