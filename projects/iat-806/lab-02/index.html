<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab 02 - Make the Ball Yours</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        margin: 0;
        background: #f5f7fb;
        color: #111827;
        font-family: "Segoe UI", sans-serif;
      }

      .page-shell {
        max-width: 980px;
        margin: 0 auto;
        padding: 32px 20px 60px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .canvas-wrap {
        position: relative;
        background: #fff;
        border-radius: 18px;
        padding: 22px 18px 18px;
        box-shadow: 0 16px 35px rgba(15, 23, 42, 0.08);
      }

      .intro {
        margin: 0 0 18px;
        font-size: 1rem;
        line-height: 1.7;
        color: #374151;
      }

      #sketch-holder {
        display: flex;
        justify-content: center;
      }

      canvas {
        display: block;
        margin: 0 auto;
        border-radius: 12px;
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="topbar">
        <a href="../../iat806.html" class="btn btn-outline-primary btn-sm"
          >← Back to IAT806</a
        >
      </div>

      <div class="canvas-wrap">
        <p class="intro">
          This version of the bouncing ball adds a random color shift on click,
          a pause toggle with the space bar, and quick size controls with b and
          s. Click inside the canvas to send the ball in a new direction.
        </p>
        <div id="sketch-holder"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
