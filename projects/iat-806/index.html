<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IAT806 Labs</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        background: #fafafa;
      }

      .page-shell {
        max-width: 960px;
        margin: 64px auto 80px;
        padding: 0 20px;
      }

      .content-box {
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 32px 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      }

      .lab-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
        margin-top: 28px;
      }

      .lab-card {
        display: block;
        padding: 20px 18px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        text-decoration: none;
        color: inherit;
      }

      .lab-card h3 {
        margin: 0 0 8px;
        font-size: 1.2rem;
      }

      .lab-card .lab-tag {
        display: inline-block;
        margin-bottom: 10px;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #0d6efd;
      }

      .lab-card p {
        margin: 0;
        color: #4b5563;
      }

      @media (max-width: 700px) {
        .lab-list {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="content-box">
        <a
          href="../../index.html#projects"
          class="btn btn-outline-primary btn-sm mb-3"
          >← Back to Portfolio</a
        >
        <h1>IAT806 Lab Collection</h1>

        <div class="lab-list">
          <a href="../../interactive-graphic-design.html" class="lab-card">
            <span class="lab-tag">Lab01</span>
            <h3>Interactive Graphic Design</h3>
            <p>Open the first interactive design assignment.</p>
          </a>

          <a href="lab-02/index.html" class="lab-card">
            <span class="lab-tag">Lab02</span>
            <h3>Make the Ball Yours</h3>
            <p>
              Play with a colorful bouncing ball that reacts to clicks and keys.
            </p>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
